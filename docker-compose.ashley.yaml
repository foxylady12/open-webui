services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    ports:
      - "3000:8080"
    environment:
      # No Ollama needed - we use Claude API via Pipe function
      - OLLAMA_BASE_URL=
      - WEBUI_SECRET_KEY=equity-research-2024
      # Use PostgreSQL instead of SQLite for all Open WebUI data
      - DATABASE_URL=postgresql://doc_admin:Sw116dsSw116ds!@host.docker.internal:5432/open_webui
      # Disable telemetry
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
      # Allow CORS for local dev
      - CORS_ALLOW_ORIGIN=*
    extra_hosts:
      # This allows the container to reach localhost services (PostgreSQL)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  open-webui: {}
